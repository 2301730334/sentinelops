{% extends "base.html" %}
{% block title %}Edit {{ scan.filename }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">Edit scan</h1>
    <div class="card shadow-sm"><div class="card-body p-4">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="filename" class="form-label">Name</label>
          <input class="form-control" id="filename" name="filename" maxlength="255" required value="{{ form.filename }}">
        </div>
        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea class="form-control" id="notes" name="notes" rows="4" maxlength="2000">{{ form.notes }}</textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a href="{{ url_for('scans.detail', scan_id=scan.id) }}" class="btn btn-link">Cancel</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
