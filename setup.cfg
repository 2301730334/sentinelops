[tool:pytest]
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy.*
    ignore::DeprecationWarning:prometheus_flask_exporter.*

[coverage:run]
source = app
branch = True

[coverage:report]
show_missing = True
fail_under = 85
skip_covered = False
