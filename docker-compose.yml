# SentinelOps: app + PostgreSQL, fully containerised.
#
#   cp .env.example .env        # set SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:8000
#
# Values come from .env in this folder (Compose reads it automatically).
name: sentinelops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped
    # Not published on the host: only the app can reach the database.

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ${IMAGE_REPO:-sentinelops}:${IMAGE_TAG:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sentinelops}
      # Plain HTTP on localhost; set to true behind HTTPS (Ingress, Phase 3+).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-20000}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    ports:
      - "${APP_PORT:-8000}:8000"
    # Hardening: immutable filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    restart: unless-stopped

volumes:
  pgdata:

networks:
  backend:
